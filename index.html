<title>Plantas en acción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: escenario ilustrado a la izquierda (se acerca a cada parte y abre su escena), panel de explicación a la derecha; juegos en vista aparte */
:root{
  --bg:#e9f3ee; --paper:#ffffff; --ink:#1d2b22; --muted:#56685c; --line:#cfe0d4;
  --leaf:#2b7a3d; --leaf-soft:#dbefdc; --sun:#f2ad1d; --sun-soft:#fdf0c9; --berry:#c2457a; --sky:#d6eefa;
  --good:#2f9e55; --bad:#d6453d;
  --shadow:0 12px 30px rgba(29,43,34,.13);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a14; --paper:#18241c; --ink:#e7f1e9; --muted:#9db3a3; --line:#2b3c31;
  --leaf:#7fd08f; --leaf-soft:#20372a; --sun:#f5bd45; --sun-soft:#3a3016; --berry:#f08ab1; --sky:#1b2d3a;
  --good:#5fd28a; --bad:#ff7a70; --shadow:0 12px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a14; --paper:#18241c; --ink:#e7f1e9; --muted:#9db3a3; --line:#2b3c31;
  --leaf:#7fd08f; --leaf-soft:#20372a; --sun:#f5bd45; --sun-soft:#3a3016; --berry:#f08ab1; --sky:#1b2d3a;
  --good:#5fd28a; --bad:#ff7a70; --shadow:0 12px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:18px 16px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4.4vw,2.9rem);line-height:1;margin:0;color:var(--leaf);text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--berry);width:18px;height:18px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:14px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-family:var(--display);font-weight:700;font-size:1.05rem;padding:6px 16px 3px;border-radius:999px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);font-size:.85rem}
.tab[aria-selected="true"]{background:var(--leaf);border-color:var(--leaf);color:var(--paper)}
.tab[aria-selected="true"] .n{background:var(--paper);color:var(--leaf)}
.tab.play{border-color:var(--sun)}
.tab.play[aria-selected="true"]{background:var(--sun);border-color:var(--sun);color:#2a2005}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:22px;align-items:start}
.col{min-width:0}
.stage{position:relative;aspect-ratio:8/5;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:var(--sky);border:3px solid var(--paper)}
.stage > svg{display:block;width:100%;height:100%}
.hot{cursor:pointer}
.hot:hover > .art,.hot:focus-visible > .art,.hot.active > .art{filter:drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 2px #ffd23f)}
.hot:focus{outline:none}
.badge circle.b{fill:#ffd23f;stroke:#7a5300;stroke-width:2}
.badge text{font:800 15px var(--display);fill:#3a2a00}
.hot.seen .badge circle.b{fill:#3fae5c;stroke:#1d5f2f}
.hot.seen .badge text{fill:#fff}
.ring{fill:none;stroke:#ffd23f;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.hot.seen .ring{display:none}
.hide-badges .badge{display:none}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.9);opacity:0}}
.scene{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;background:var(--sky)}
.scene.on{opacity:1}
.scene svg{display:block;width:100%;height:100%}
.sbtn{position:absolute;top:10px;border:0;border-radius:999px;padding:6px 14px 4px;font:700 .95rem var(--display);cursor:pointer;background:rgba(255,255,255,.92);color:#1d2b22;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.sbtn.back{left:10px}.sbtn.again{right:10px}

.talk{display:flex;align-items:flex-start;gap:10px;margin-top:12px;min-height:84px}
.mascot{flex:0 0 70px;width:70px;height:78px}
.bubble{position:relative;flex:1;min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:10px 16px;font-weight:700;font-size:1.06rem;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;width:16px;height:16px;background:var(--paper);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.bubble .go{margin-top:8px;border:0;background:var(--sun);color:#2a2005;font:800 1rem var(--display);border-radius:999px;padding:6px 16px 3px;cursor:pointer}
.stars{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.stars .st{display:flex;gap:3px}
.stars .st span{font-size:1.15rem;color:var(--line);transition:color .3s,transform .3s}
.stars .st span.on{color:var(--sun);transform:scale(1.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:700;cursor:pointer}
.chip.seen{border-color:var(--good);color:var(--good)}
.chip.active{background:var(--sun-soft);border-color:var(--sun);color:var(--ink)}

.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--paper);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;max-height:calc(100vh - 28px);display:flex;flex-direction:column}
.pbody{padding:18px 20px 20px;overflow-y:auto;min-height:0}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.panel h2{font-family:var(--display);font-size:1.85rem;line-height:1.05;margin:4px 0 6px;color:var(--leaf);text-wrap:balance}
.content > *{animation:rise .5s both cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.content p{margin:10px 0 0}
.content strong{color:var(--leaf)}
.box{margin-top:14px;border-radius:14px;padding:10px 14px;font-size:.95rem}
.box h3{margin:0 0 4px;font-family:var(--display);font-size:1.05rem}
.box ul{margin:0;padding-left:20px}
.box.key{background:var(--leaf-soft)} .box.key h3{color:var(--leaf)}
.box.fun{background:var(--sun-soft)} .box.fun h3{color:var(--ink)}
.box.teach{border:2px dashed var(--berry)} .box.teach h3{color:var(--berry)}
body:not(.docente) .box.fun,body:not(.docente) .box.teach{display:none}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-top:2px solid var(--line)}
.nav button{font:700 .95rem var(--display);border-radius:999px;border:2px solid var(--leaf);background:transparent;color:var(--leaf);padding:5px 13px 2px;cursor:pointer}
.nav button.primary{background:var(--leaf);color:var(--paper)}
.nav button.on{background:var(--sun);border-color:var(--sun);color:#2a2005}
.nav .count{margin-left:auto;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{height:4px;background:var(--sun);width:0}
.timer.run{animation:tm linear forwards}
@keyframes tm{to{width:100%}}

/* Juegos */
.games h2{font-family:var(--display);color:var(--leaf);font-size:2rem;margin:0 0 4px}
.gmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:14px}
.gcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.gcard:hover{transform:translateY(-3px);border-color:var(--sun)}
.gcard svg{width:100%;height:110px;border-radius:14px;background:var(--leaf-soft)}
.gcard b{font:800 1.25rem var(--display);color:var(--leaf)}
.gcard span{color:var(--muted);font-size:.92rem}
.garea{background:var(--paper);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-top:14px}
.ghead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.ghead h3{font:800 1.5rem var(--display);color:var(--leaf);margin:0}
.ghead .meta{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.gbtn{border:2px solid var(--leaf);background:transparent;color:var(--leaf);font:700 1rem var(--display);border-radius:999px;padding:5px 14px 2px;cursor:pointer}
.gbtn.primary{background:var(--leaf);color:var(--paper)}
.gbtn.sunny{background:var(--sun);border-color:var(--sun);color:#2a2005}
.tip{color:var(--muted);margin:0 0 10px}
.fb{min-height:1.6em;font-weight:800;margin:10px 0 0}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.card{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 14px;font-weight:800;cursor:grab;font-size:1rem;user-select:none;transition:transform .15s,border-color .15s,background .15s}
.card.sel{border-color:var(--sun);background:var(--sun-soft);transform:translateY(-3px) scale(1.04)}
.card.done{border-color:var(--good);color:var(--good);cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lstage{position:relative;width:min(100%,460px);aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;background:var(--sky)}
.lstage svg{display:block;width:100%;height:100%}
.target{position:absolute;transform:translate(-50%,-50%);min-width:96px;min-height:36px;border:3px dashed #ffffff;background:rgba(255,255,255,.55);color:#1d2b22;border-radius:12px;font:800 .95rem var(--display);padding:4px 8px 1px;cursor:pointer}
.target.ok{border-style:solid;border-color:var(--good);background:#e6f7ea;color:#1f6b38}
.target.no{border-color:var(--bad);background:#fde6e4}
.bins{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.bin{border:3px dashed var(--line);border-radius:16px;padding:10px;min-height:130px;background:var(--leaf-soft);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bin h4{margin:0;font:800 1.1rem var(--display);color:var(--leaf);text-align:center}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin.hover{border-color:var(--sun)}
.bin.no{border-color:var(--bad)}
.slots{display:grid;gap:8px;counter-reset:s;margin:10px 0}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;min-height:50px;font-weight:700}
.slot::before{counter-increment:s;content:counter(s);flex:0 0 32px;height:32px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf);display:grid;place-items:center;font:800 1.1rem var(--display)}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--leaf-soft)}
.qbox{max-width:640px;margin:0 auto}
.qbox .q{font:800 1.35rem var(--display);margin:6px 0 12px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:800;font-size:1.02rem;cursor:pointer}
.opt:hover{border-color:var(--sun)}
.opt.ok{border-color:var(--good);background:#e6f7ea;color:#1f6b38}
.opt.no{border-color:var(--bad);background:#fde6e4;color:#8b1d16}
.expl{margin-top:10px;background:var(--leaf-soft);border-radius:12px;padding:10px 14px}
.leafview{width:min(100%,300px);aspect-ratio:1;margin:0 auto 10px;border-radius:18px;overflow:hidden;background:#eaf6e4}
.leafview svg{width:100%;height:100%;display:block}
.end{text-align:center;padding:16px 0}
.end .big{font-size:3rem;letter-spacing:6px}
.end h3{font:800 2rem var(--display);color:var(--leaf);margin:6px 0}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:900px){
  .grid{grid-template-columns:1fr}
  .panel{position:static;max-height:none}
  .sbtn{font-size:.85rem;padding:5px 11px 3px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Plantas en acción</h1>
      <p class="sub">Toca las partes que brillan y mira lo que pasa dentro de la planta.</p>
    </div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <label class="toggle"><input type="checkbox" id="badges" checked> Números</label>
      
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>

  <section class="grid" id="explora">
    <div class="col">
      <div class="stage" id="stage">
        <div id="mainHost" style="width:100%;height:100%"></div>
        <div class="scene" id="scene" hidden>
          <div id="sceneSvg" style="width:100%;height:100%"></div>
          <button class="sbtn back" id="back">← Volver</button>
          <button class="sbtn again" id="again">↻ Otra vez</button>
        </div>
      </div>
      <div class="talk">
        <svg class="mascot" viewBox="0 0 70 78" aria-hidden="true">
          <g><animateTransform attributeName="transform" type="rotate" values="-6 35 26;6 35 26;-6 35 26" dur="2.4s" repeatCount="indefinite"/>
            <path d="M35 26 C35 18 35 12 35 6" stroke="#3f8f3f" stroke-width="3" fill="none"/>
            <path d="M35 10 C28 4 20 4 16 8 C22 14 30 14 35 10Z" fill="#56b35a"/>
            <path d="M35 8 C42 1 50 2 54 6 C48 12 40 12 35 8Z" fill="#56b35a"/></g>
          <ellipse cx="35" cy="50" rx="27" ry="24" fill="#e9c58c" stroke="#a7783a" stroke-width="3"/>
          <ellipse cx="25" cy="47" rx="3.5" ry="4.5" fill="#2b1d0e"><animate attributeName="ry" values="4.5;4.5;.5;4.5" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
          <ellipse cx="44" cy="47" rx="3.5" ry="4.5" fill="#2b1d0e"><animate attributeName="ry" values="4.5;4.5;.5;4.5" keyTimes="0;.9;.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
          <path d="M27 58 Q35 64 43 58" stroke="#2b1d0e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="19" cy="56" r="4" fill="#f2a08a" opacity=".7"/><circle cx="51" cy="56" r="4" fill="#f2a08a" opacity=".7"/>
        </svg>
        <div class="bubble" id="bubble" aria-live="polite"></div>
      </div>
      <div class="stars"><span id="starTxt"></span><span class="st" id="starRow"></span></div>
      <div class="chips" id="chips"></div>
    </div>
    <aside class="panel">
      <div class="timer" id="timer"></div>
      <div class="pbody" id="pbody"></div>
      <div class="nav">
        <button id="prev">‹ Anterior</button>
        <button id="next" class="primary">Siguiente ›</button>
        <button id="auto">▶ Recorrido</button>
        <span class="count" id="count"></span>
      </div>
    </aside>
  </section>

  <section class="games" id="juegos" hidden>
    <h2>¡A practicar!</h2>
    <p class="sub">Elige un juego. Puedes tocar una tarjeta y luego su sitio, o arrastrarla.</p>
    <div class="gmenu" id="gmenu"></div>
    <div class="garea" id="garea" hidden></div>
  </section>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ================= Ayudas de dibujo ================= */
let ID="u0",UID=0;
const C={leaf:"#56b35a",leafD:"#2e7d32",stem:"#3f8f3f",water:"#2f8fe6",sap:"#5fc43c",root:"#f0dcb0",sun:"#ffd23f",ink:"#1d2b22"};
const RAD=Math.PI/180;
const A={
 fade:(b,d=.6)=>`<animate attributeName="opacity" from="0" to="1" begin="${b}s" dur="${d}s" fill="freeze"/>`,
 out:(b,d=.6)=>`<animate attributeName="opacity" from="1" to="0" begin="${b}s" dur="${d}s" fill="freeze"/>`,
 draw:(b,d=1.2)=>`<animate attributeName="stroke-dashoffset" from="1" to="0" begin="${b}s" dur="${d}s" fill="freeze"/>`,
 grow:(b,d=.8)=>`<animateTransform attributeName="transform" type="scale" from="0" to="1" begin="${b}s" dur="${d}s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .3 1"/>`,
 sway:(x,y,a=3,d=3.5)=>`<animateTransform attributeName="transform" type="rotate" values="${-a} ${x} ${y};${a} ${x} ${y};${-a} ${x} ${y}" dur="${d}s" repeatCount="indefinite"/>`,
 pulse:(d=1.4,lo=.55)=>`<animate attributeName="opacity" values="1;${lo};1" dur="${d}s" repeatCount="indefinite"/>`,
 bob:(a=4,d=2)=>`<animateTransform attributeName="transform" type="translate" values="0 0;0 ${-a};0 0" dur="${d}s" repeatCount="indefinite" additive="sum"/>`
};
const F=(s,b,d=.6)=>`<g opacity="0">${A.fade(b,d)}${s}</g>`;
const FO=(s,b,d=.6)=>`<g>${A.out(b,d)}${s}</g>`;
const GA=(x,y,s,b,d=.8)=>`<g transform="translate(${x} ${y})"><g transform="scale(0)">${A.grow(b,d)}<g transform="translate(${-x} ${-y})">${s}</g></g></g>`;
const GY=(x,y,s,b,d=1.2)=>`<g transform="translate(${x} ${y})"><g transform="scale(1 0)"><animateTransform attributeName="transform" type="scale" from="1 0" to="1 1" begin="${b}s" dur="${d}s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .3 1"/><g transform="translate(${-x} ${-y})">${s}</g></g></g>`;
const D=(d,b,dur,stroke,w,extra="")=>`<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${A.draw(b,dur)}</path>`;
const PS=(d,stroke,w)=>`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"/>`;
const T=(x,y,s,b=null,o={})=>{const el=`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.s||17}" font-weight="800" fill="${o.f||C.ink}" stroke="${o.st||'#fff'}" stroke-width="${o.sw||5}" stroke-linejoin="round" paint-order="stroke" style="font-family:var(--display)">${s}</text>`;return b==null?el:F(el,b)};
function leafP(len,wd=.38){return `M0 0 C${len*.3} ${-len*wd} ${len*.75} ${-len*wd*.85} ${len} 0 C${len*.75} ${len*wd*.85} ${len*.3} ${len*wd} 0 0Z`}
function leafAbs(cx,cy,len,ang,wd=.38){const c=Math.cos(ang*RAD),s=Math.sin(ang*RAD),P=(x,y)=>`${(cx+x*c-y*s).toFixed(1)} ${(cy+x*s+y*c).toFixed(1)}`;return `M${P(0,0)} C${P(len*.3,-len*wd)} ${P(len*.75,-len*wd*.85)} ${P(len,0)} C${P(len*.75,len*wd*.85)} ${P(len*.3,len*wd)} ${P(0,0)}Z`}
function rotP(cx,cy,ang){const c=Math.cos(ang*RAD),s=Math.sin(ang*RAD);return (x,y)=>[cx+x*c-y*s,cy+x*s+y*c]}
function leaf(x,y,len,ang,o={}){return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="${leafP(len,o.wd||.38)}" fill="${o.fill||C.leaf}" stroke="${o.stroke||C.leafD}" stroke-width="1.6"/><path d="M2 0 L${len*.9} 0" stroke="${o.stroke||C.leafD}" stroke-width="1.3" opacity=".55"/></g>`}
function defs(extra=""){return `<defs><filter id="${ID}gl" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffd23f" flood-opacity="1"/></filter>${extra}</defs>`}
function bg(g,o={}){const n=o.night;return defs(`<linearGradient id="${ID}sk" gradientUnits="userSpaceOnUse" x1="0" y1="-150" x2="0" y2="${g}"><stop offset="0" stop-color="${n?'#0b1534':'#79c4f1'}"/><stop offset="1" stop-color="${n?'#2c3f73':'#e2f4fd'}"/></linearGradient><linearGradient id="${ID}so" gradientUnits="userSpaceOnUse" x1="0" y1="${g}" x2="0" y2="${g+320}"><stop offset="0" stop-color="#93603a"/><stop offset="1" stop-color="#583720"/></linearGradient>`)+`<rect x="-1200" y="-1200" width="3200" height="${1200+g}" fill="url(#${ID}sk)"/><rect x="-1200" y="${g}" width="3200" height="2400" fill="url(#${ID}so)"/><rect x="-1200" y="${g-5}" width="3200" height="10" fill="#5fae4f"/>`}
function paper(c="#eaf6e4"){return defs()+`<rect x="-1200" y="-1200" width="3200" height="3200" fill="${c}"/>`}
function grid(){let s="";for(let i=-400;i<=800;i+=40){s+=`<line x1="${i}" y1="-600" x2="${i}" y2="1000" stroke="#cfe5c6" stroke-width="1"/><line x1="-600" y1="${i}" x2="1000" y2="${i}" stroke="#cfe5c6" stroke-width="1"/>`}return s}
function pebbles(g,xs=[[40,40],[330,70],[120,110],[280,150],[60,175],[380,30],[-40,90],[440,120]]){return xs.map(([x,y])=>`<ellipse cx="${x}" cy="${g+y}" rx="9" ry="6" fill="#7b5233"/>`).join("")}
function sun(x,y,r=26){let rays="";for(let i=0;i<12;i++)rays+=`<line x1="0" y1="${-r-6}" x2="0" y2="${-r-18}" stroke="${C.sun}" stroke-width="4" stroke-linecap="round" transform="rotate(${i*30})"/>`;return `<g transform="translate(${x} ${y})"><g>${rays}<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></g><circle r="${r}" fill="${C.sun}" stroke="#f0a500" stroke-width="3"/><circle cx="-8" cy="-4" r="2.5" fill="#7a5300"/><circle cx="8" cy="-4" r="2.5" fill="#7a5300"/><path d="M-8 6 Q0 12 8 6" stroke="#7a5300" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>`}
function moon(x,y,bgc="#13214a"){return `<g transform="translate(${x} ${y})"><circle r="24" fill="#f6f1cf"/><circle cx="11" cy="-7" r="22" fill="${bgc}"/></g>`}
function stars(pts){return pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="${2+i%3}s" repeatCount="indefinite"/></circle>`).join("")}
function cloud(x,y,s=1){return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="34" ry="16" fill="#fff"/><circle cx="-14" cy="-8" r="14" fill="#fff"/><circle cx="10" cy="-12" r="17" fill="#fff"/></g>`}
function drift(s,dx=40,d=14){return `<g>${`<animateTransform attributeName="transform" type="translate" values="0 0;${dx} 0;0 0" dur="${d}s" repeatCount="indefinite"/>`}${s}</g>`}
function wind(y0=70,b=0){let s="";[[y0,0],[y0+40,.8],[y0+80,1.6]].forEach(([y,o])=>s+=`<path d="M-70 ${y} q30 -10 60 0 t60 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0"><animateTransform attributeName="transform" type="translate" from="0 0" to="520 0" dur="2.4s" begin="${b+o}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.95;.95;0" dur="2.4s" begin="${b+o}s" repeatCount="indefinite"/></path>`);return s}
const DROP=`<path d="M0 -8 C4 -3 6 1 6 3.5 A6 6 0 0 1 -6 3.5 C-6 1 -4 -3 0 -8Z" fill="${C.water}" stroke="#1b6fbd" stroke-width="1"/>`;
const CO2=`<g><circle r="13" fill="#97a3ab"/><circle cx="-12" cy="4" r="9" fill="#97a3ab"/><circle cx="12" cy="4" r="9" fill="#97a3ab"/><text y="5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" style="font-family:var(--display)">CO₂</text></g>`;
const O2=`<g><circle r="13" fill="#e4f2ff" stroke="${C.water}" stroke-width="2"/><text y="4.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1f5fa8" style="font-family:var(--display)">O₂</text></g>`;
const DOT=(c,r=4.5)=>`<circle r="${r}" fill="${c}" stroke="#fff" stroke-width="1.2"/>`;
const SUGAR=`<rect x="-8" y="-8" width="16" height="16" rx="3" fill="#fff1c7" stroke="#c9a14b" stroke-width="2"/>`;
const BOLT=`<path d="M5 -20 L-10 4 L0 4 L-5 20 L12 -5 L2 -5Z" fill="#ffc53d" stroke="#c98500" stroke-width="2" stroke-linejoin="round"/>`;
const POLLEN=`<circle r="3.2" fill="#ffd21f" stroke="#c99a10" stroke-width="1"/>`;
function flow(path,shape,{n=5,dur=3,begin=0,rep="indefinite"}={}){let s="";for(let i=0;i<n;i++){const b=(begin+i*dur/n).toFixed(2);s+=`<g opacity="0"><animateMotion path="${path}" dur="${dur}s" begin="${b}s" repeatCount="${rep}"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="${dur}s" begin="${b}s" repeatCount="${rep}"/>${shape}</g>`}return s}
function arrowHead(x,y,ang,c,sz=9){const p=rotP(x,y,ang);const a=p(0,0),b=p(-sz,-sz*.7),d=p(-sz,sz*.7);return `<path d="M${a} L${b} L${d}Z" fill="${c}"/>`}
function line(x1,y1,x2,y2,c="#1d2b22",w=2.5,dash=""){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${dash?`stroke-dasharray="${dash}"`:""}/>`}

/* ---- Plantas y objetos ---- */
function sunflower(x,y,r){let p="";for(let i=0;i<14;i++)p+=`<ellipse cx="0" cy="${-r}" rx="${r*.32}" ry="${r*.62}" fill="#ffc928" stroke="#e39b00" stroke-width="1.2" transform="rotate(${i*360/14})"/>`;return `<g transform="translate(${x} ${y})">${p}<circle r="${r*.64}" fill="#7a4a21"/><circle r="${r*.42}" fill="#5d3616"/></g>`}
function daisy(x,y,r=16){let p="";for(let i=0;i<10;i++)p+=`<ellipse cx="0" cy="${-r*.8}" rx="${r*.28}" ry="${r*.6}" fill="#fff" stroke="#d9d9d9" transform="rotate(${i*36})"/>`;return `<g transform="translate(${x} ${y})">${p}<circle r="${r*.38}" fill="#ffc928" stroke="#e39b00"/></g>`}
function plantParts(x,g,h,o={}){const top=g-h;const stem=`<path d="M${x} ${g} C${x+8} ${g-h*.4} ${x-8} ${g-h*.7} ${x} ${top}" stroke="${C.stem}" stroke-width="${o.sw||7}" fill="none" stroke-linecap="round"/>`;let leaves="";(o.leaves||[.35,.55,.75]).forEach((f,i)=>{leaves+=leaf(x,g-h*f,o.ll||58,i%2?205:-25)});const flower=o.flower===false?"":(o.daisy?daisy(x,top,o.fr||18):sunflower(x,top,o.fr||22));return {stem,leaves,flower}}
function plant(x,g,h,o={}){const p=plantParts(x,g,h,o);const s=p.stem+p.leaves+p.flower;return o.sway===false?s:`<g>${A.sway(x,g,o.sa||2.5,o.sd||3.5)}${s}</g>`}
function rootsMain(x,g,b=0,s=1,anim=true,w=1){const ps=[`M${x} ${g} C${x+2} ${g+40*s} ${x-3} ${g+80*s} ${x} ${g+125*s}`,`M${x} ${g+22*s} C${x-20*s} ${g+32*s} ${x-42*s} ${g+44*s} ${x-62*s} ${g+70*s}`,`M${x} ${g+30*s} C${x+25*s} ${g+40*s} ${x+46*s} ${g+55*s} ${x+64*s} ${g+82*s}`,`M${x} ${g+62*s} C${x-15*s} ${g+72*s} ${x-30*s} ${g+88*s} ${x-42*s} ${g+112*s}`,`M${x} ${g+72*s} C${x+15*s} ${g+82*s} ${x+28*s} ${g+96*s} ${x+38*s} ${g+120*s}`,`M${x-30*s} ${g+48*s} C${x-36*s} ${g+60*s} ${x-34*s} ${g+70*s} ${x-30*s} ${g+80*s}`,`M${x+32*s} ${g+50*s} C${x+38*s} ${g+64*s} ${x+36*s} ${g+74*s} ${x+30*s} ${g+86*s}`];return ps.map((p,i)=>{const sw=(i?(i>4?2:3.5):7*w)*Math.max(.7,s*.9);return anim?D(p,b+(i?0.5+i*.22:0),1.2,C.root,sw):PS(p,C.root,sw)}).join("")}
function rootsFasc(x,g,b=0,s=1,anim=true){let o="";for(let i=0;i<11;i++){const dx=(i-5)*11*s,ex=x+dx*2.2+((i*37)%9-4)*3*s,ey=g+(80+((i*53)%40))*s;const p=`M${x+(i-5)*2*s} ${g} C${x+dx*.6} ${g+30*s} ${ex-dx*.3} ${g+55*s} ${ex} ${ey}`;o+=anim?D(p,b+i*.12,1.3,C.root,2.6):PS(p,C.root,2.2)}return o}
function dandelion(x,g,s=1){let o="";[[200,62],[225,52],[-20,62],[-45,52],[185,40],[-5,40]].forEach(([a,l])=>o+=leaf(x,g-3,l*s,a,{wd:.24,fill:"#4fa84a"}));o+=`<path d="M${x} ${g} Q${x+6*s} ${g-60*s} ${x} ${g-115*s}" stroke="#5aa54a" stroke-width="${4*s}" fill="none"/>`;let p="";for(let i=0;i<18;i++)p+=`<line x1="0" y1="0" x2="0" y2="${-15*s}" stroke="#ffcf1f" stroke-width="${4*s}" stroke-linecap="round" transform="rotate(${i*20})"/>`;return o+`<g transform="translate(${x} ${g-118*s})">${p}<circle r="${6*s}" fill="#f2b705"/></g>`}
function wheat(x,g,s=1){let o="";[-14,-7,0,7,14].forEach((d,i)=>{const h=(95+(i%2)*20)*s;o+=`<path d="M${x+d*.3*s} ${g} Q${x+d*s} ${g-h*.5} ${x+d*1.8*s} ${g-h}" stroke="#7fb24a" stroke-width="${3*s}" fill="none" stroke-linecap="round"/>`});[-12,0,12].forEach((d,i)=>{const tx=x+d*1.6*s,ty=g-(125+(i%2)*10)*s;let e="";for(let k=0;k<5;k++)e+=`<ellipse cx="${(k%2?4:-4)*s}" cy="${-k*7*s}" rx="${4*s}" ry="${6*s}" fill="#e3b94f" stroke="#b88b2a"/>`;o+=`<path d="M${x+d*.2*s} ${g} Q${x+d*s} ${g-70*s} ${tx} ${ty}" stroke="#a9b950" stroke-width="${2.5*s}" fill="none"/><g transform="translate(${tx} ${ty})">${e}</g>`});return o}
function herb(x,g,h,s=1,c="#63bb55"){let o=`<path d="M${x} ${g} Q${x+8*s} ${g-h/2} ${x} ${g-h}" stroke="${c}" stroke-width="${3.2*s}" fill="none" stroke-linecap="round"/>`;for(let k=1;k<5;k++){o+=leaf(x+(k%2?2:-2),g-h*k/5,19*s,k%2?-35:215,{fill:c,wd:.36})}return o+leaf(x,g-h,17*s,-90,{fill:c,wd:.36})}
function canopy(x,y,r){return [[0,0,1],[-.62,.22,.7],[.62,.25,.7],[-.3,-.48,.66],[.36,-.42,.66]].map(([dx,dy,k],i)=>`<circle cx="${x+dx*r}" cy="${y+dy*r}" r="${r*k}" fill="${i%2?'#4a9c45':'#3f8d3c'}"/>`).join("")+`<circle cx="${x-.25*r}" cy="${y-.25*r}" r="${r*.33}" fill="#62b358" opacity=".6"/>`}
function trunk(x,g,h,s=1){return `<path d="M${x-12*s} ${g} L${x-8*s} ${g-h} L${x+8*s} ${g-h} L${x+12*s} ${g}Z" fill="#8a5a33" stroke="#6a4225" stroke-width="2"/><path d="M${x} ${g-h*.7} L${x-30*s} ${g-h*.95} M${x} ${g-h*.8} L${x+32*s} ${g-h*1.02}" stroke="#7a4e2b" stroke-width="${6*s}" stroke-linecap="round"/>`}
function tree(x,g,h=150,s=1){return trunk(x,g,h,s)+canopy(x,g-h-25*s,70*s)}
function shrubParts(x,g,s=1){return {t:`<path d="M${x-5*s} ${g} L${x-3*s} ${g-18*s} M${x+4*s} ${g} L${x+3*s} ${g-18*s} M${x} ${g-12*s} L${x-30*s} ${g-30*s} M${x} ${g-10*s} L${x+30*s} ${g-30*s}" stroke="#7a4e2b" stroke-width="${5*s}" stroke-linecap="round"/>`,c:[[0,-44,28],[-32,-32,22],[32,-32,22],[-15,-58,21],[18,-58,21]].map(([dx,dy,r],i)=>`<circle cx="${x+dx*s}" cy="${g+dy*s}" r="${r*s}" fill="${i%2?'#4a9c45':'#3f8d3c'}"/>`).join("")}}
function shrub(x,g,s=1){const p=shrubParts(x,g,s);return p.c+p.t}
function carrotLeaves(x,g,s=1){let o="";[-20,-8,5,18].forEach((d,i)=>{const h=(55+i%2*12)*s;o+=`<path d="M${x} ${g} Q${x+d*.6*s} ${g-30*s} ${x+d*1.6*s} ${g-h}" stroke="#4f9d3a" stroke-width="${2.5*s}" fill="none"/>`;[.45,.7,1].forEach(t=>o+=`<circle cx="${x+d*1.6*s*t}" cy="${g-h*t}" r="${6*s}" fill="#5cb04a"/>`)});return o}
function carrotRoot(x,g,s=1){return `<path d="M${x-17*s} ${g-2} C${x-17*s} ${g+50*s} ${x-4*s} ${g+105*s} ${x} ${g+128*s} C${x+4*s} ${g+105*s} ${x+17*s} ${g+50*s} ${x+17*s} ${g-2}Z" fill="#f08a24" stroke="#c96a12" stroke-width="2"/>`+[25,50,75].map(y=>`<path d="M${x-12*s+y*.07*s} ${g+y*s} l${9*s} 2" stroke="#c96a12" stroke-width="2"/>`).join("")}
function beet(x,g,s=1){return [[-25,60],[0,70],[25,60]].map(([d,h])=>`<path d="M${x} ${g} Q${x+d*.5*s} ${g-h*.5*s} ${x+d*s} ${g-h*s}" stroke="#b02c5a" stroke-width="${2.5*s}" fill="none"/>`+leaf(x+d*s,g-h*s,26*s,-90+d,{fill:"#3f8f3f",wd:.45})).join("")+`<path d="M${x-28*s} ${g+18*s} C${x-28*s} ${g-6*s} ${x+28*s} ${g-6*s} ${x+28*s} ${g+18*s} C${x+28*s} ${g+40*s} ${x+6*s} ${g+48*s} ${x} ${g+70*s} C${x-6*s} ${g+48*s} ${x-28*s} ${g+40*s} ${x-28*s} ${g+18*s}Z" fill="#8e1f4f" stroke="#5f1033" stroke-width="2"/>`}
function rabbit(x,g,s=1){return `<g><ellipse cx="${x-28*s}" cy="${g-26*s}" rx="${8*s}" ry="${8*s}" fill="#fff"/><ellipse cx="${x}" cy="${g-22*s}" rx="${30*s}" ry="${22*s}" fill="#d8cbbd" stroke="#a9998a" stroke-width="2"/><ellipse cx="${x+20*s}" cy="${g-72*s}" rx="${6*s}" ry="${20*s}" fill="#d8cbbd" stroke="#a9998a" stroke-width="2" transform="rotate(-12 ${x+20*s} ${g-72*s})"/><ellipse cx="${x+33*s}" cy="${g-70*s}" rx="${6*s}" ry="${19*s}" fill="#d8cbbd" stroke="#a9998a" stroke-width="2" transform="rotate(14 ${x+33*s} ${g-70*s})"/><circle cx="${x+27*s}" cy="${g-42*s}" r="${17*s}" fill="#d8cbbd" stroke="#a9998a" stroke-width="2"/><circle cx="${x+33*s}" cy="${g-46*s}" r="${2.6*s}" fill="#222"/><circle cx="${x+43*s}" cy="${g-40*s}" r="${2.6*s}" fill="#f09ab0"/><ellipse cx="${x-8*s}" cy="${g-2*s}" rx="${12*s}" ry="${4*s}" fill="#c4b6a7"/></g>`}
function bee(){return `<g><ellipse cx="-3" cy="-14" rx="9" ry="6" fill="#fff" opacity=".9"><animate attributeName="ry" values="6;2;6" dur=".16s" repeatCount="indefinite"/></ellipse><ellipse cx="6" cy="-13" rx="7" ry="5" fill="#fff" opacity=".85"><animate attributeName="ry" values="5;1.5;5" dur=".16s" repeatCount="indefinite"/></ellipse><ellipse rx="15" ry="10" fill="#ffcc33" stroke="#333" stroke-width="1.5"/><path d="M-5 -9 L-5 9 M3 -9.5 L3 9.5" stroke="#333" stroke-width="3.5"/><circle cx="14" cy="-1" r="6" fill="#333"/><circle cx="16" cy="-3" r="1.6" fill="#fff"/><path d="M-15 0 L-21 0" stroke="#333" stroke-width="2"/></g>`}
function sign(x,y,g,txt){const L=txt.split("|");return `<rect x="${x-4}" y="${y}" width="8" height="${g-y}" fill="#8a5a33"/><rect x="${x-56}" y="${y-30}" width="112" height="${L.length>1?50:38}" rx="9" fill="#f6dda5" stroke="#a87638" stroke-width="3"/>`+L.map((l,i)=>`<text x="${x}" y="${y-8+i*18}" text-anchor="middle" font-size="14.5" font-weight="800" fill="#5a3a12" style="font-family:var(--display)">${l}</text>`).join("")}
function magnifier(x,y,r,inner,clipId){return `<line x1="${x+r*.72}" y1="${y+r*.72}" x2="${x+r*1.25}" y2="${y+r*1.25}" stroke="#5a5a5a" stroke-width="${r*.22}" stroke-linecap="round"/><clipPath id="${clipId}"><circle cx="${x}" cy="${y}" r="${r}"/></clipPath><circle cx="${x}" cy="${y}" r="${r}" fill="#effae9"/><g clip-path="url(#${clipId})">${inner}</g><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#5a5a5a" stroke-width="${r*.12}"/><path d="M${x-r*.55} ${y-r*.3} A${r*.65} ${r*.65} 0 0 1 ${x-r*.15} ${y-r*.62}" stroke="#fff" stroke-width="${r*.08}" fill="none" opacity=".8"/>`}
function cells(x,y,r){let s="";for(let i=-3;i<=3;i++)for(let j=-3;j<=3;j++){const cx=x+i*34+(j%2?17:0),cy=y+j*28;s+=`<rect x="${cx-15}" y="${cy-12}" width="30" height="24" rx="6" fill="#c9eeb6" stroke="#8cc77a" stroke-width="1.5"/>`;[[-7,-4],[6,-3],[-1,5]].forEach(([a,b],k)=>s+=`<ellipse cx="${cx+a}" cy="${cy+b}" rx="4.5" ry="3" fill="#2f9a3a">${A.pulse(1.2+((i+j+k)%3)*.3,.4)}</ellipse>`)}return s}

/* Frutos y semillas */
const apple=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#e23b3b" stroke="#a51f24" stroke-width="2"/><ellipse cx="${x-r*.35}" cy="${y-r*.35}" rx="${r*.22}" ry="${r*.14}" fill="#fff" opacity=".5"/><path d="M${x} ${y-r*.8} q2 -${r*.4} ${r*.15} -${r*.5}" stroke="#6b3e1c" stroke-width="3" fill="none"/>`+leaf(x+2,y-r*1.1,r*.6,-30,{wd:.4});
const orange=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#ff9a1f" stroke="#d26f00" stroke-width="2"/>${[[-.3,-.2],[.2,.1],[-.1,.4],[.35,-.35]].map(([a,b])=>`<circle cx="${x+a*r}" cy="${y+b*r}" r="1.6" fill="#d26f00"/>`).join("")}`+leaf(x,y-r*.95,r*.55,-40,{wd:.4});
const peach=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#ffb27a" stroke="#e07c45" stroke-width="2"/><circle cx="${x+r*.3}" cy="${y+r*.1}" r="${r*.55}" fill="#ff8a6a" opacity=".55"/><path d="M${x} ${y-r} Q${x-r*.3} ${y} ${x} ${y+r}" stroke="#e07c45" stroke-width="2" fill="none"/>`;
const strawberry=(x,y,r)=>`<path d="M${x-r} ${y-r*.4} C${x-r} ${y+r*.6} ${x-r*.2} ${y+r*1.2} ${x} ${y+r*1.3} C${x+r*.2} ${y+r*1.2} ${x+r} ${y+r*.6} ${x+r} ${y-r*.4} C${x+r*.6} ${y-r*.9} ${x-r*.6} ${y-r*.9} ${x-r} ${y-r*.4}Z" fill="#e62e48" stroke="#a5122a" stroke-width="2"/>${[[-.5,0],[0,-.2],[.5,0],[-.3,.5],[.3,.5],[0,.9]].map(([a,b])=>`<ellipse cx="${x+a*r}" cy="${y+b*r}" rx="1.6" ry="2.4" fill="#ffe27a"/>`).join("")}<path d="M${x-r*.7} ${y-r*.6} L${x} ${y-r*.3} L${x+r*.7} ${y-r*.6} L${x} ${y-r*.95}Z" fill="#4caf50"/>`;

/* ================= Tipos de plantas: dibujos ================= */

const RAD = Math.PI / 180;

function leafPath(len, wd = .38) { return `M0 0 C${len*.3} ${-len*wd} ${len*.75} ${-len*wd*.85} ${len} 0 C${len*.75} ${len*wd*.85} ${len*.3} ${len*wd} 0 0Z`; }

}
// punto en curva cuadrática
const qpt = (p0, p1, p2, t) => [(1-t)*(1-t)*p0[0] + 2*(1-t)*t*p1[0] + t*t*p2[0], (1-t)*(1-t)*p0[1] + 2*(1-t)*t*p1[1] + t*t*p2[1]];

 const mini=(cx,cy)=>`<g transform="translate(${cx-60} ${cy-88}) scale(.3)">${f.stem}${f.caliz}${f.corola}${f.estambres}${f.estilo}${f.ovario}</g>`;
 CEN.forEach(([cx,cy],i)=>{let c=`<clipPath id="${ID}k${i}"><circle cx="${cx}" cy="${cy}" r="76"/></clipPath><circle cx="${cx}" cy="${cy}" r="76" fill="#fffdf5" stroke="#2b7a3d" stroke-width="4"/><g clip-path="url(#${ID}k${i})">`;
  if(i===0)c+=mini(cx,cy)+flow(`M${cx-10} ${cy-38} C${cx-30} ${cy-60} ${cx-40} ${cy-70} ${cx-50} ${cy-80}`,POLLEN,{n:3,dur:2.2})+flow(`M${cx+10} ${cy-38} C${cx+30} ${cy-60} ${cx+40} ${cy-70} ${cx+50} ${cy-80}`,POLLEN,{n:3,dur:2.4});
  if(i===1)c+=mini(cx,cy)+`<g transform="translate(${cx+22} ${cy-50}) scale(.8)">${A.bob(5,1.1)}${bee()}</g>`;
  if(i===2)c+=`<path d="M${cx} ${cy-50} q-4 -14 6 -20" stroke="#2b7a3d" stroke-width="5" fill="none"/>${leaf(cx,cy-48,22,200,{fill:"#4f9d45",wd:.3})}${leaf(cx,cy-48,22,-20,{fill:"#4f9d45",wd:.3})}<path d="M${cx-38} ${cy-30} C${cx-50} ${cy+20} ${cx-20} ${cy+55} ${cx} ${cy+55} C${cx+20} ${cy+55} ${cx+50} ${cy+20} ${cx+38} ${cy-30} C${cx+20} ${cy-48} ${cx-20} ${cy-48} ${cx-38} ${cy-30}Z" fill="#e0322f" stroke="#9b1513" stroke-width="3"/><path d="M${cx} ${cy-44} C${cx+40} ${cy-40} ${cx+40} ${cy+50} ${cx} ${cy+53}Z" fill="#ffe2b8"/>${[[12,-20],[20,-4],[14,12],[22,26]].map(([a,b])=>`<ellipse cx="${cx+a}" cy="${cy+b}" rx="4" ry="2.6" fill="#fff6d6" stroke="#c9a14b"/>`).join("")}`;
  if(i===3)c+=`<rect x="${cx-80}" y="${cy+20}" width="160" height="70" fill="#8d5b36"/><rect x="${cx-80}" y="${cy+17}" width="160" height="7" fill="#5fae4f"/><ellipse cx="${cx-10}" cy="${cy+40}" rx="12" ry="8" fill="#f4ead2" stroke="#a5824c" stroke-width="2"/>${PS(`M${cx} ${cy+45} C${cx+2} ${cy+60} ${cx-3} ${cy+70} ${cx+2} ${cy+82}`,C.root,3)}<g>${A.sway(cx,cy+20,4,3)}${PS(`M${cx} ${cy+20} C${cx+3} ${cy} ${cx-3} ${cy-20} ${cx} ${cy-40}`,C.stem,5)}${leaf(cx,cy-30,30,-30)}${leaf(cx,cy-30,30,210)}</g>`;
  c+=`</g><circle cx="${cx-56}" cy="${cy-56}" r="15" fill="#2b7a3d"/><text x="${cx-56}" y="${cy-50}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" style="font-family:var(--display)">${i+1}</text>`;
  s+=H(6+i,c)});
 return s}
};

  ga.querySelectorAll(".bin").forEach(b=>{b.onclick=()=>put(b,selI);b.onkeydown=e=>{if(e.key==="Enter"){put(b,selI)}};b.ondragover=e=>{e.preventDefault();b.classList.add("hover")};b.ondragleave=()=>b.classList.remove("hover");b.ondrop=e=>{e.preventDefault();b.classList.remove("hover");put(b,e.dataTransfer.getData("text/plain"))}})}
 round()}

/* Ordenar */
function gOrder(){const rounds=[
 {n:"La germinación de una semilla",steps:["La semilla cae al suelo y encuentra humedad.","La semilla se abre y sale la raíz.","Crecen el tallo y las primeras hojas.","La plantita sigue creciendo y se convierte en una planta."]},
 {n:"Cómo se reproducen las plantas",steps:["En los estambres se produce el polen.","El polen llega al pistilo de otra flor, con el viento o con los insectos.","El ovario madura y se transforma en el fruto, con las semillas.","La semilla cae al suelo, germina y nace una nueva planta."]}];
 let r=0,ok=0,tot=0;
 function round(){const R=rounds[r];let next=0,miss=0;
  ga.innerHTML=head("Ordena los pasos",`Ronda ${r+1} de ${rounds.length} · ${R.n}`)+`<p class="tip">Toca los pasos en orden: ¿qué pasa primero?</p><div class="slots">${R.steps.map(()=>`<div class="slot"></div>`).join("")}</div><div class="tray">${shuffle(R.steps.map((s,i)=>({s,i}))).map(o=>`<span class="card" data-i="${o.i}" tabindex="0" role="button">${o.s}</span>`).join("")}</div><div class="fb" id="fb"></div>`;wireMenu();
  const F=$("#fb"),slots=ga.querySelectorAll(".slot");
  ga.querySelectorAll(".tray .card").forEach(c=>{const go=()=>{if(+c.dataset.i===next){slots[next].textContent=c.textContent;slots[next].classList.add("ok");c.remove();next++;tot++;if(miss===0)ok++;miss=0;fb(F,true,"¡Eso es!");
    if(next===R.steps.length){F.innerHTML="¡Orden perfecto! ";const b=document.createElement("button");b.className="gbtn sunny";b.textContent=r<rounds.length-1?"Siguiente ronda →":"Ver resultado";b.onclick=()=>{r++;r<rounds.length?round():endScreen(ok,tot,()=>{r=0;ok=0;tot=0;round()})};F.append(b);confetti()}}
   else{miss++;shake(c);fb(F,false,"Todavía no toca ese paso. ¿Qué pasa antes?")}};c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}})}
 round()}

/* Adivina la hoja */
function leafQuizSVG(it){ID="g"+(++UID);let s=paper("#eaf6e4")+grid();if(it.k==="shape"){const S=SHAPES[it.n];s+=D(S.pet,.1,.5,"#3d7f2a",6)+S.d.map((d,i)=>`<path d="${d}" fill="#5cb85c" opacity="0">${A.fade(1.2,.6)}</path>`+D(d,.2+i*.1,1.2,"#2e7d32",3.5)).join("")+(it.n==="aguja"?`<path d="${S.pet}" fill="#8a5a33"/>`:"")}else{const p=edgePath(it.n);s+=PS("M10 200 L40 200","#3d7f2a",6)+`<path d="${p}" fill="#5cb85c" opacity="0">${A.fade(1.2,.6)}</path>`+D(p,.2,1.4,"#2e7d32",3.5)}return s}
function gLeaf(){const sh=Object.keys(SHAPES),ed=["lisa","dentada","lobulada"];
 const qs=shuffle(sh).slice(0,6).map(n=>({k:"shape",n})).concat(shuffle(ed).slice(0,2).map(n=>({k:"edge",n})));
 const Q=shuffle(qs);let i=0,ok=0;
 function q(){const it=Q[i];const svg=leafQuizSVG(it);
  const pool=it.k==="shape"?sh:ed,names=it.k==="shape"?SHAPE_NAMES:EDGE_NAMES;
  const opts=it.k==="shape"?shuffle([it.n].concat(shuffle(pool.filter(x=>x!==it.n)).slice(0,3))):shuffle(ed);
  ga.innerHTML=head("Adivina la hoja",`${i+1} de ${Q.length} · Aciertos: ${ok}`)+`<div class="qbox"><div class="leafview"><svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">${svg}</svg></div><div class="q">${it.k==="shape"?"¿Qué forma tiene esta hoja?":"¿Cómo es el borde de esta hoja?"}</div><div class="opts">${opts.map(o=>`<button class="opt" data-o="${o}">${names[o]}</button>`).join("")}</div><div id="ex"></div></div>`;wireMenu();
  ga.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(ga.querySelector(".opt.ok"))return;const right=b.dataset.o===it.n;if(right){b.classList.add("ok");ok++}else{b.classList.add("no");ga.querySelector(`.opt[data-o="${it.n}"]`).classList.add("ok")}
   $("#ex").innerHTML=`<div class="expl">${right?"¡Correcto! ":"Era "+names[it.n].toLowerCase()+". "}${it.k==="shape"?"Ejemplo: "+SHAPES[it.n].ej+".":""}</div><p style="text-align:center"><button class="gbtn sunny" id="nx">${i<Q.length-1?"Siguiente →":"Ver resultado"}</button></p>`;
   $("#nx").onclick=()=>{i++;i<Q.length?q():endScreen(ok,Q.length,gLeaf)}})}
 q()}
